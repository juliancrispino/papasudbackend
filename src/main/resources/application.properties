spring.application.name=papasud

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/papasud}
spring.datasource.username=${DB_USER:papasud}
spring.datasource.password=${DB_PASSWORD:papasud}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Contrato JSON (FASE 1) ---
# El auto-config de Spring Boot es la fuente de verdad del ObjectMapper.
# FAIL_ON_UNKNOWN_PROPERTIES se fija en false de forma explicita: el frontend envia
# campos legacy/extra que el backend debe tolerar sin devolver 400. Jackson 3 ya usa
# ese default, pero dejarlo escrito evita que un cambio de version lo reintroduzca.
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

springdoc.swagger-ui.path=/swagger-ui.html

# --- Groq (FASE 12) ---
# GROQ_API_KEY es el nombre canonico. OPENAI_API_KEY se acepta como alias legacy.
groq.api.url=${GROQ_API_URL:${OPENAI_API_URL:https://api.groq.com/openai/v1/chat/completions}}
groq.api.key=${GROQ_API_KEY:${OPENAI_API_KEY:}}
groq.api.model=${AI_MODEL:${OPENAI_API_MODEL:openai/gpt-oss-20b}}
groq.api.timeout-ms=${GROQ_TIMEOUT_MS:${OPENAI_API_TIMEOUT_MS:30000}}
groq.api.max-completion-tokens=${GROQ_MAX_COMPLETION_TOKENS:${OPENAI_API_MAX_COMPLETION_TOKENS:4096}}

# --- Auth (FASE 3) ---
papasud.auth.username=${PAPASTOCK_AUTH_USERNAME:operador}
papasud.auth.password-hash=${PAPASTOCK_AUTH_PASSWORD_HASH:}
papasud.auth.dev-password=${PAPASTOCK_AUTH_DEV_PASSWORD:}
papasud.auth.session-secret=${PAPASTOCK_SESSION_SECRET:}
papasud.auth.secure-cookies=${PAPASTOCK_SECURE_COOKIES:false}
papasud.auth.same-site=${PAPASTOCK_COOKIE_SAMESITE:Lax}
papasud.auth.session-ttl-minutes=${PAPASTOCK_SESSION_TTL_MINUTES:480}
papasud.auth.plant=${PAPASTOCK_PLANT:Planta Balcarce}

# --- CORS (FASE 3) ---
# Vacio => same-origin puro (arquitectura objetivo). Se completa solo en dev/staging.
papasud.cors.allowed-origins=${PAPASTOCK_ALLOWED_ORIGINS:}
