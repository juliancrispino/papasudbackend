spring.application.name=papasud

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/papasud}
spring.datasource.username=${DB_USER:papasud}
spring.datasource.password=${DB_PASSWORD:papasud}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

springdoc.swagger-ui.path=/swagger-ui.html

openai.api.url=${OPENAI_API_URL:https://api.groq.com/openai/v1/chat/completions}
openai.api.key=${OPENAI_API_KEY:}
openai.api.model=${OPENAI_API_MODEL:openai/gpt-oss-20b}
openai.api.timeout-ms=${OPENAI_API_TIMEOUT_MS:30000}
openai.api.max-completion-tokens=${OPENAI_API_MAX_COMPLETION_TOKENS:4096}
