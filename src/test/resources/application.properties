spring.application.name=papasud-test

# Zonky reemplaza el DataSource, pero Boot igual exige una URL para arrancar el contexto.
spring.datasource.url=jdbc:postgresql://localhost:5432/papasud_test
spring.datasource.username=papasud
spring.datasource.password=papasud

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Sin API key: los tests ejercitan el camino heuristico, que es el que debe funcionar
# siempre. El camino LLM se cubre aparte con el cliente mockeado.
groq.api.key=
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=openai/gpt-oss-20b
groq.api.timeout-ms=30000

# Credenciales de test. dev-password solo se acepta con secure-cookies=false.
papasud.auth.username=operador
papasud.auth.password-hash=
papasud.auth.dev-password=test-password-123
papasud.auth.session-secret=test-session-secret-de-al-menos-32-caracteres
papasud.auth.secure-cookies=false
papasud.auth.same-site=Lax
papasud.auth.session-ttl-minutes=60

papasud.cors.allowed-origins=
